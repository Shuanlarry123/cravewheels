<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://cravewheels.com/" />

    <!-- Primary SEO -->
    <title>Cravewheels — Video Food Delivery | Order from Local Restaurants</title>
    <meta
      name="description"
      content="Cravewheels is a video-first food delivery marketplace. Swipe through crave-worthy dish clips from local restaurants, then order delivery or pickup in seconds. Schedule orders, apply promo codes, and track your delivery live."
    />
    <meta
      name="keywords"
      content="food delivery, video food ordering, local restaurants, order food online, food pickup, restaurant delivery, dish videos, food deals, Cravewheels"
    />
    <meta name="author" content="Cravewheels" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Cravewheels" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cravewheels" />
    <meta property="og:title" content="Cravewheels — Video Food Delivery | Order from Local Restaurants" />
    <meta
      property="og:description"
      content="Discover and order your next meal through an immersive feed of mouth-watering video clips from local restaurants. Delivery, pickup, scheduling, deals, and live tracking."
    />
    <meta property="og:url" content="https://cravewheels.com/" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=1200&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cravewheels video food delivery" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cravewheels — Video Food Delivery" />
    <meta
      name="twitter:description"
      content="Swipe through crave-worthy dish clips from local restaurants, then order delivery or pickup in seconds."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=1200&q=80" />
    <meta name="twitter:image:alt" content="Cravewheels video food delivery" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cravewheels",
        "url": "https://cravewheels.com/",
        "description": "A video-first food delivery marketplace connecting hungry customers with local restaurants through immersive dish clips.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://cravewheels.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "Food Delivery",
        "name": "Cravewheels Food Delivery",
        "areaServed": "United States",
        "url": "https://cravewheels.com/",
        "description": "Video-first food delivery and pickup from local restaurants, with scheduling, promo codes, and live order tracking."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
